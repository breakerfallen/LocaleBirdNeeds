  .tile .name {

  .tile .nameSvg {
    position: absolute; left: 0; top: 0;

  .tile .art { display: flex; align-items: flex-end; justify-content: center; width: 100%; }
  .tile img {

<script>
const BASE = 230;   // art side (px) of the largest bird
const MIN = 78;     // smallest legible art side
let ALL = [];       // full fetched+enriched list (30-day superset)
let fetchedAt = 0;  // when the server last pulled from eBird
let placed = [];    // rendered tiles for silhouette hit-testing
let flockNaturalW = 1; // unscaled collage width, for mapping cursor -> local
let hovered = null; // currently-highlighted tile record
let cfg = null;

function daysAgo(obsDt) {
  if (!obsDt) return 999;
  const d = new Date(obsDt.replace(" ", "T"));
  if (isNaN(d)) return 999;
  return (Date.now() - d.getTime()) / 86400000;
}

// ---- hover pill ----------------------------------------------------------
function milesFrom(lat, lng) {
  if (!cfg || typeof lat !== "number" || typeof lng !== "number") return null;
  const R = 3958.8, toRad = (x) => (x * Math.PI) / 180;
  const dLat = toRad(lat - cfg.lat), dLng = toRad(lng - cfg.lng);
  const h = Math.sin(dLat / 2) ** 2 +
            Math.cos(toRad(cfg.lat)) * Math.cos(toRad(lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function agoLabel(obsDt) {
  const days = daysAgo(obsDt);
  if (days >= 900) return "";
  const hours = days * 24;
  if (hours < 1) return "under an hour ago";
  if (hours < 48) return `${Math.round(hours)} h ago`;
  return `${Math.round(days)} d ago`;
}

function highlight(tileEl, o) {
  tileEl.classList.add("is-hover");
  const tip = document.getElementById("tip");
  tip.innerHTML = "";

  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = o.comName;
  tip.appendChild(nm);

  const whoBits = peopleOf(cfg).filter((p) => needsFor(o, p.id)).map((p) => p.label);
  if (whoBits.length) {
    const who = document.createElement("span");
    who.className = "soft";
    const verb = whoBits.length === 1 ? "needs" : "need";
    who.textContent = ` — ${whoBits.join(" & ")} ${verb} this`;
    tip.appendChild(who);
  }

  const where = document.createElement("span");
  where.className = "soft";
  const mi = milesFrom(o.lat, o.lng);
  const bits = [];
  // eBird personal locations often embed "US-CO 39.55213, -104.92426" — trim it.
  const loc = (o.locName || "")
    .replace(/,?\s*[A-Z]{2}-[A-Z]{2}\s+-?\d+(\.\d+)?,\s*-?\d+(\.\d+)?\s*$/, "")
    .trim();
  if (loc) bits.push(loc.length > 44 ? loc.slice(0, 42) + "…" : loc);
  if (mi != null) bits.push(`${mi < 10 ? mi.toFixed(1) : Math.round(mi)} mi`);
  const ago = agoLabel(o.obsDt);
  if (ago) bits.push(ago);
  if (bits.length) where.textContent = ` · ${bits.join(" · ")}`;
  tip.appendChild(where);

  tip.classList.add("show");
  tip.setAttribute("aria-hidden", "false");
}

function unhighlight(tileEl) {
  tileEl.classList.remove("is-hover");
  const tip = document.getElementById("tip");
  tip.classList.remove("show");
  tip.setAttribute("aria-hidden", "true");
}

// ---- silhouette (alpha-mask) cache --------------------------------------
// Each bird packs by its actual shape, not a square box, so small birds nest
// into the empty space around a big bird's spread wings (AvianVisitors' trick).
const CELL = 9;      // world px per occupancy cell
const PAD_CELLS = 2; // min gap between birds, in cells (keeps them from touching)
const silCache = {};

function loadImg(src) {
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = src; });
}

// A second, finer mask used only for lettering geometry. The packing grid is
// 30 px on its long side — plenty to nest shapes, far too coarse to find a
// stretch of back straight enough to write along. Column profiles (topmost and
// bottommost ink per column) are what the run finder actually reads.
const FINE_RES = 120;
const fineCache = {};
async function ensureFine(url) {
  if (fineCache[url]) return fineCache[url];
  let fine;
  try {
    const img = await loadImg(url);
    const nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
    let fw, fh;
    if (nw >= nh) { fw = FINE_RES; fh = Math.max(1, Math.round(FINE_RES * nh / nw)); }
    else { fh = FINE_RES; fw = Math.max(1, Math.round(FINE_RES * nw / nh)); }
    const c = document.createElement("canvas"); c.width = fw; c.height = fh;
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, fw, fh);
    const d = ctx.getImageData(0, 0, fw, fh).data;
    const solid = new Uint8Array(fw * fh);
    const top = new Int16Array(fw).fill(-1), bot = new Int16Array(fw).fill(-1);
    for (let x = 0; x < fw; x++) {
      for (let y = 0; y < fh; y++) {
        if (d[(y * fw + x) * 4 + 3] > 20) {
          solid[y * fw + x] = 1;
          if (top[x] < 0) top[x] = y;
          bot[x] = y;
        }
      }
    }
    fine = { fw, fh, solid, top, bot };
  } catch {
    fine = null;
  }
  fineCache[url] = fine; return fine;
}

async function ensureSil(url) {
  if (silCache[url]) return silCache[url];
  let sil;
  try {
    const img = await loadImg(url);
    const nw = img.naturalWidth || 1, nh = img.naturalHeight || 1;
    const RES = 30;
    let gw, gh;
    if (nw >= nh) { gw = RES; gh = Math.max(1, Math.round(RES * nh / nw)); }
    else { gh = RES; gw = Math.max(1, Math.round(RES * nw / nh)); }
    const c = document.createElement("canvas"); c.width = gw; c.height = gh;
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, gw, gh);
    const data = ctx.getImageData(0, 0, gw, gh).data;
    const set = new Set();
    for (let j = 0; j < gh; j++) for (let i = 0; i < gw; i++)
      if (data[(j * gw + i) * 4 + 3] > 20) set.add(i + "|" + j); // low thresh keeps thin legs/bills/wingtips
    if (!set.size) set.add("0|0");
    sil = { ar: nw / nh, gw, gh, set };
  } catch {
    const set = new Set(); for (let i = 0; i < 6; i++) for (let j = 0; j < 6; j++) set.add(i + "|" + j);
    sil = { ar: 1, gw: 6, gh: 6, set };
  }
  silCache[url] = sil; return sil;
}

// Spiral pack by silhouette: biggest bird at the centre, each next one spirals
// out to the first spot where its occupied cells (plus a 1-cell gap) don't hit
// an already-placed bird's cells.
// ---- optional bird names ------------------------------------------------
// The name is measured before packing and its strip is added to the tile's
// occupied cells, so the nester leaves a gap for the lettering instead of
// letting it fall across the bird below.
const LABEL_GAP = 3;         // px between the art and the name
const LABEL_MIN_TILE = 56;   // don't letter a bird drawn smaller than this (sqrt of tile area)
const labelCtx = document.createElement("canvas").getContext("2d");
let labelUid = 0;

// ---- nested names: find a run of outline worth writing along ---------------
// After the treatment described at theodore.net/projects/AvianVisitors — the
// name rides a stretch of the bird's own edge (a back, a belly) so it reads as
// part of the drawing rather than a caption pinned underneath. This version
// fits a straight baseline to that run rather than bending type along the
// contour: upstream allows a run to bow off its chord anyway, and a straight
// line is what its fallback tier draws, so the effect survives and the geometry
// stays honest. Runs are read off the column profiles of the fine mask.
const LABEL_NEAR = 2;      // px of paper between the silhouette and the letters
const LABEL_DEG = 55;      // steepest overall lean that still reads as writing
// Bow is no longer a straightness test. When the name was set on a chord drawn
// through the run, a curved run meant type floating off the bird, so bow had to
// be small; now the type is set on the run's own curve, so bow IS the effect and
// the limit only rules out a run that doubles back on itself.
const LABEL_BOW = 0.34;
const LABEL_MIN_RUN = 0.22; // shortest usable run, as a share of tile width
const LABEL_ASC = 0.80;    // Caveat's inked band above the baseline, in em
const LABEL_DESC = 0.25;   // and below
const LABEL_EXT_EM = 3.0;  // how far the line may carry past its run, per side, in em
// Kept next to the CSS that draws it: canvas measures the name to size the
// reserved box, so the two must agree or every width is wrong.
const LABEL_WEIGHT = 400;

// Least-squares line through (x, y) samples -> {m, b, bow}.
function fitRun(xs, ys) {
  const n = xs.length;
  let sx = 0, sy = 0, sxx = 0, sxy = 0;
  for (let i = 0; i < n; i++) { sx += xs[i]; sy += ys[i]; sxx += xs[i] * xs[i]; sxy += xs[i] * ys[i]; }
  const den = n * sxx - sx * sx;
  const m = Math.abs(den) < 1e-6 ? 0 : (n * sxy - sx * sy) / den;
  const b = (sy - m * sx) / n;
  let bow = 0;
  for (let i = 0; i < n; i++) bow = Math.max(bow, Math.abs(ys[i] - (m * xs[i] + b)));
  return { m, b, bow };
}

// Best run along one profile ("back" = top edge, letters sit above it;
// "belly" = bottom edge, letters sit below). Coordinates are fine-mask px.
function bestRun(prof, side, fw, minRunPx) {
  let best = null;
  const valid = (x) => prof[x] >= 0;
  for (let len = fw; len >= minRunPx; len = Math.floor(len * 0.85)) {
    for (let x0 = 0; x0 + len <= fw; x0 += Math.max(1, Math.floor(len * 0.12))) {
      const xs = [], ys = [];
      let gap = false;
      for (let x = x0; x < x0 + len; x++) {
        if (!valid(x)) { gap = true; break; }
        xs.push(x); ys.push(prof[x]);
      }
      if (gap || xs.length < 4) continue;
      const f = fitRun(xs, ys);
      if (f.bow > LABEL_BOW * len) continue;
      const deg = Math.abs(Math.atan(f.m) * 180 / Math.PI);
      if (deg > LABEL_DEG) continue;
      // Longest wins. Flatness used to be rewarded here, which quietly steered
      // every name onto the straightest scrap of edge a bird had — the reason
      // they "rounded but not really". A long run follows more of the drawing.
      const score = len;
      if (!best || score > best.score) {
        best = { score, x0, x1: x0 + len - 1, m: f.m, b: f.b, side, len };
      }
    }
    if (best) break;   // longest tier that yields anything wins
  }
  return best;
}

// Build the baseline the lettering will actually ride: the run's own profile,
// smoothed, then pushed off the silhouette along its local normal. This is the
// curve handed to <textPath>, so each glyph stands on the bird's own contour
// rather than on a chord drawn through it.
function baselineFor(fine, run, px, fineScale, textW) {
  const dir = run.side === "back" ? -1 : 1;
  const prof = run.side === "back" ? fine.top : fine.bot;
  // Baseline sits a hair off the ink: descenders hang toward a back, ascenders
  // rise toward a belly, so the clearance differs by side.
  const push = (LABEL_NEAR + (dir < 0 ? LABEL_DESC : LABEL_ASC) * px) / fineScale;

  const raw = [];
  for (let x = run.x0; x <= run.x1; x++) if (prof[x] >= 0) raw.push([x, prof[x]]);
  if (raw.length < 4) return null;
  const K = 5;
  // Take the OUTWARD envelope first — the extreme of the profile over the
  // window, not its average. Averaging lets the line lag behind anything that
  // rises fast (a goose's neck, a curlew's head) and dip below the outline it
  // is meant to sit outside; the clearance pass then correctly refuses most of
  // the run, and a big bird ends up with a caption. The envelope can only sit
  // further onto the paper, never inside the bird.
  const env = [];
  for (let i = 0; i < raw.length; i++) {
    let v = raw[i][1];
    for (let k = -K; k <= K; k++) {
      const j = i + k; if (j < 0 || j >= raw.length) continue;
      v = dir < 0 ? Math.min(v, raw[j][1]) : Math.max(v, raw[j][1]);
    }
    env.push([raw[i][0], v]);
  }
  // Then smooth the envelope, so glyphs do not jitter on single-pixel steps.
  const sm = [];
  for (let i = 0; i < env.length; i++) {
    let sy = 0, n = 0;
    for (let k = -K; k <= K; k++) { const j = i + k; if (j >= 0 && j < env.length) { sy += env[j][1]; n++; } }
    sm.push([env[i][0], sy / n]);
  }
  // Offset each sample along the local normal, onto the paper side.
  const pts = [];
  for (let i = 0; i < sm.length; i++) {
    const a = sm[Math.max(0, i - 2)], b = sm[Math.min(sm.length - 1, i + 2)];
    let nx = -(b[1] - a[1]), ny = (b[0] - a[0]);
    const len = Math.hypot(nx, ny) || 1;
    nx /= len; ny /= len;
    if (ny * dir < 0) { nx = -nx; ny = -ny; }   // point onto the paper side
    pts.push([sm[i][0] + nx * push, sm[i][1] + ny * push]);
  }

  // Offsetting a curve outward folds it wherever the source turns concave —
  // the belly beside a leg, the notch under a tail. The fold shows up as the
  // baseline doubling back on itself, and type set on it reverses mid-word.
  // The run is parameterised left to right, so the baseline must advance in x;
  // anything that does not is part of a fold and is dropped.
  const fwd = [];
  for (const q of pts) if (!fwd.length || q[0] > fwd[fwd.length - 1][0] + 0.15) fwd.push(q);
  pts.length = 0; pts.push(...fwd);
  if (pts.length < 4) return null;

  // Carry the line on past the run until it is long enough to set the whole
  // name — a run has to point, not contain. Two rules keep the overhang from
  // wrapping around a tail or dropping through a pair of feet:
  //
  //   the direction comes from a chord across the last fifth of the run, not
  //   from its final two samples, so a curl right at the tip cannot steer it;
  //   and the extension is laid down as its own dense run of points, so the
  //   clearance test below actually walks along it. Adding it as one far-away
  //   point left the whole overhang untested, which is how a name ended up
  //   drawn straight across a bird's feet.
  const need = (textW / fineScale) * 1.06;
  const ext = (LABEL_EXT_EM * px) / fineScale;
  const span = Math.max(2, Math.floor(pts.length * 0.2));
  const tang = (p, q) => { const dx = q[0] - p[0], dy = q[1] - p[1]; const l = Math.hypot(dx, dy) || 1; return [dx / l, dy / l]; };
  const measure = (a) => { let L = 0; for (let i = 1; i < a.length; i++) L += Math.hypot(a[i][0] - a[i - 1][0], a[i][1] - a[i - 1][1]); return L; };
  let plen = measure(pts);
  // Extend by the whole allowance rather than only the shortfall: the ends are
  // where a name meets a head or a tail, and the clear-span pass needs slack on
  // both sides to slide the name into whatever stretch is actually open.
  const grow = ext;
  if (grow > 0) {
    const STEP = 1.5;
    const t0 = tang(pts[span], pts[0]);                       // outward, at the head
    const t1 = tang(pts[pts.length - 1 - span], pts[pts.length - 1]);
    const head = [], tail = [];
    for (let d = STEP; d <= grow; d += STEP) {
      head.unshift([pts[0][0] + t0[0] * d, pts[0][1] + t0[1] * d]);
      tail.push([pts[pts.length - 1][0] + t1[0] * d, pts[pts.length - 1][1] + t1[1] * d]);
    }
    pts.unshift(...head); pts.push(...tail);
    plen = measure(pts);
  }
  return { pts, dir, side: run.side, lenFine: plen, need };
}

// Which points of a candidate baseline the lettering could actually stand on.
// Two tests per point, because either alone lets a bad placement through:
//
//   the baseline is checked against the true column profile, since smoothing
//   cuts corners and on a steep edge — a heron's neck, an ibis's bill — the
//   smoothed line can sit inside ink the raw profile knows about; and the
//   inked band is sampled against the mask along the path NORMAL, because a
//   glyph stands on the local tangent, so where a baseline curves its letters
//   lean sideways and a vertical band walks straight past them.
function clearFlags(fine, pts, side, dir, px, fineScale) {
  const asc = LABEL_ASC * px / fineScale, desc = LABEL_DESC * px / fineScale;
  const near = (LABEL_NEAR / fineScale) * 0.8;
  const prof = side === "back" ? fine.top : fine.bot;
  const STEPS = 6;
  const ok = new Array(pts.length);
  for (let i = 0; i < pts.length; i++) {
    const [x, y] = pts[i];
    const xx = Math.round(x);
    let good = true;
    if (xx >= 0 && xx < fine.fw && prof[xx] >= 0 && (y - prof[xx]) * dir < near) good = false;
    if (good) {
      const a = pts[Math.max(0, i - 2)], b = pts[Math.min(pts.length - 1, i + 2)];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const L = Math.hypot(dx, dy) || 1;
      const ux = dy / L, uy = -dx / L;           // glyph "up": tangent turned -90
      for (let k = 0; k <= STEPS && good; k++) {
        const t = -desc + (k / STEPS) * (asc + desc);
        const sx = Math.round(x + ux * t), sy = Math.round(y + uy * t);
        if (sx < 0 || sx >= fine.fw || sy < 0 || sy >= fine.fh) continue;  // paper
        if (fine.solid[sy * fine.fw + sx]) good = false;
      }
    }
    ok[i] = good;
  }
  return ok;
}

// Longest run of consecutive clear points. Trimming beats an all-or-nothing
// verdict: a long name on a big bird overhangs its run, and that overhang often
// clips the head at one end — refusing the whole placement for it is what sent
// every large bird to a caption. Here the blocked tail is simply cut off and
// what remains is judged on its own length.
function longestClearSpan(ok) {
  let bi = 0, bl = 0, i = 0;
  while (i < ok.length) {
    if (!ok[i]) { i++; continue; }
    let j = i;
    while (j < ok.length && ok[j]) j++;
    if (j - i > bl) { bl = j - i; bi = i; }
    i = j;
  }
  return [bi, bl];
}

// Keep only as much of a clear stretch as the name actually needs, centred on
// it. The clear span is often far longer than the word; reserving all of it
// inflates every bird's footprint, the packer pushes the flock apart and fit()
// scales the whole board down to compensate.
function centreSlice(pts, targetLen) {
  const total = polyLen(pts);
  if (total <= targetLen) return pts;
  const seg = [];
  for (let i = 1; i < pts.length; i++) seg.push(Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const half = targetLen / 2;
  let mid = 0, acc = 0;
  while (mid < seg.length && acc + seg[mid] < total / 2) { acc += seg[mid]; mid++; }
  let i0 = mid, d = 0;
  while (i0 > 0 && d < half) { d += seg[i0 - 1]; i0--; }
  let i1 = mid, e = 0;
  while (i1 < seg.length && e < half) { e += seg[i1]; i1++; }
  return pts.slice(i0, i1 + 1);
}

function polyLen(pts) {
  let L = 0;
  for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
  return L;
}

// Sharpest local bend along a baseline, in degrees per em of arc. This — not
// the overall swing — is what makes lettering look wrong: glyphs are set on the
// local tangent, so a kink inside a word or two fans the outer edge and crushes
// the inner one. A long gentle arc measures low here and reads beautifully; a
// short hook measures high even when the ends line up.
function kinkOf(pts, emFine) {
  // Stepped by ARC LENGTH, not by array index. Points are spaced along the
  // source profile, so where a curve steepens a fixed number of indices spans
  // much less of the line — an index step blurs exactly the bends it is meant
  // to find, and rated a hooked belly calmer than the long back beside it.
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
  const total = cum[cum.length - 1];
  const step = Math.max(1, emFine);
  if (total < 2 * step) return 0;
  const at = (d) => {
    let i = 1;
    while (i < cum.length - 1 && cum[i] < d) i++;
    const t = (d - cum[i - 1]) / Math.max(1e-6, cum[i] - cum[i - 1]);
    return [pts[i - 1][0] + t * (pts[i][0] - pts[i - 1][0]), pts[i - 1][1] + t * (pts[i][1] - pts[i - 1][1])];
  };
  const ang = (p, q) => Math.atan2(q[1] - p[1], q[0] - p[0]);
  let worst = 0;
  for (let d = 0; d + 2 * step <= total; d += step / 2) {
    const a = at(d), b = at(d + step), c = at(d + 2 * step);
    let k = Math.abs(ang(a, b) - ang(b, c)) * 180 / Math.PI;
    if (k > 180) k = 360 - k;
    worst = Math.max(worst, k);
  }
  return worst;
}

function measureLabels(items, mode) {
  for (const it of items) {
    it.label = null; it.labelW = 0; it.labelH = 0; it.labelPx = 0; it.labelBox = null;
    if (mode === "off") continue;
    const name = it.o.comName || it.o.sciName;
    // Judge the drawing by its bulk, not its width. Tiles are sized so W*H
    // tracks length², so sqrt(W*H) is the bird's on-screen size whatever its
    // pose — width alone quietly punishes upright birds, and an owl or a
    // bittern would go unnamed beside a shorter but wider sandpiper.
    const size = Math.sqrt(it.W * it.H);
    if (!name || size < LABEL_MIN_TILE) continue;
    // Type tracks that same size, so lettering stays in proportion across a
    // flock that runs from a kinglet to a crane.
    const px = Math.round(Math.max(12, Math.min(20, size * 0.14)));
    labelCtx.font = `${LABEL_WEIGHT} ${px}px Hand, cursive`;
    const textW = Math.ceil(labelCtx.measureText(name).width);
    it.labelPx = px;

    if (mode === "nested" && it.fine) {
      const fine = it.fine;
      // Map the mask onto the tile the way the browser actually draws it. The
      // art is object-fit: contain and the tile's aspect is clamped, so a very
      // long or very tall bird is letterboxed inside its tile — scaling by
      // width alone from a 0,0 origin puts the whole baseline in the wrong
      // place, which is how a name ended up written across a bird.
      const fineScale = Math.min(it.W / fine.fw, it.H / fine.fh);
      const offX = (it.W - fine.fw * fineScale) / 2;
      const offY = (it.H - fine.fh * fineScale) / 2;
      // A share of the mask's own width — the fine mask is normalised, so this
      // is the same demand on every bird regardless of how big it is drawn.
      const minRunPx = Math.max(6, LABEL_MIN_RUN * fine.fw);
      const back = bestRun(fine.top, "back", fine.fw, minRunPx);
      const belly = bestRun(fine.bot, "belly", fine.fw, minRunPx);
      // Build BOTH edges and keep the one the name reads best on. Taking the
      // first that merely fits picked by run length, which on a bird like a
      // dowitcher hands the word to a sharply hooked belly while a long, calm
      // back sits unused.
      const emFine = px / fineScale;
      let placed = null, bestKink = Infinity;
      for (const run of [back, belly]) {
        if (!run) continue;
        const bl = baselineFor(fine, run, px, fineScale, textW);
        if (!bl) continue;
        const ok = clearFlags(fine, bl.pts, bl.side, bl.dir, px, fineScale);
        const [i0, n0] = longestClearSpan(ok);
        if (n0 < 4) continue;
        const span = bl.pts.slice(i0, i0 + n0);
        if (polyLen(span) < bl.need) continue;      // not enough clear line
        const fitted = centreSlice(span, bl.need);
        // Sharpest local bend decides, and nothing else gates on shape. An
        // end-to-end turn cap used to sit here and had it exactly backwards: a
        // long graceful arc along a back swings a long way end to end and was
        // refused, while a short hook under a belly barely swings at all and
        // sailed through. Local bend is what actually distorts letters, so it
        // both picks the edge and is the only shape test left.
        const kink = kinkOf(fitted, emFine);
        if (kink < bestKink) { bestKink = kink; placed = { pts: fitted, dir: bl.dir, side: bl.side }; }
      }
      if (placed) {
        // Path in tile px, as a polyline dense enough that glyphs read smooth.
        const d = placed.pts.map(([x, y], i) =>
          `${i ? "L" : "M"}${(x * fineScale + offX).toFixed(1)} ${(y * fineScale + offY).toFixed(1)}`).join(" ");
        let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
        const band = (LABEL_ASC + LABEL_DESC) * px;
        for (const [x, y] of placed.pts) {
          const tx = x * fineScale + offX, ty = y * fineScale + offY;
          x0 = Math.min(x0, tx); x1 = Math.max(x1, tx);
          y0 = Math.min(y0, Math.min(ty, ty - placed.dir * band));
          y1 = Math.max(y1, Math.max(ty, ty - placed.dir * band));
        }
        it.label = { mode: "nested", name, px, d };
        it.labelBox = { x0, y0, x1, y1 };
        continue;
      }
      // No edge worth writing along — fall through to the caption so no bird
      // is left bare, which is the same escape upstream's tangent tier gives.
    }

    const w = Math.min(textW + 6, it.W * 1.7);
    const h = LABEL_GAP + Math.round(px * 1.2);
    it.label = { mode: "below", name, px, w };
    it.labelW = w; it.labelH = h;
    it.labelBox = { x0: (it.W - w) / 2, y0: it.H, x1: (it.W + w) / 2, y1: it.H + h };
  }
}

function pack(items, aspect) {
  const asp = aspect || 1; // >1 spreads the flock horizontally into an oval
  const occupied = new Set();
  for (const it of items) {
    const ngx = Math.max(1, Math.ceil(it.W / CELL)), ngy = Math.max(1, Math.ceil(it.H / CELL));
    const local = [];
    for (let gx = 0; gx < ngx; gx++) for (let gy = 0; gy < ngy; gy++) {
      const si = Math.min(it.sil.gw - 1, Math.floor((gx + 0.5) * CELL / it.W * it.sil.gw));
      const sj = Math.min(it.sil.gh - 1, Math.floor((gy + 0.5) * CELL / it.H * it.sil.gh));
      if (it.sil.set.has(si + "|" + sj)) local.push([gx, gy]);
    }
    if (!local.length) local.push([0, 0]);
    // Reserve the name strip: a solid block under the art, centred on the tile.
    // Offsets may go negative when the name is wider than the bird — fine, they
    // are just deltas from the tile origin.
    if (it.labelBox) {
      const lb = it.labelBox;
      const lx0 = Math.floor(lb.x0 / CELL), lx1 = Math.ceil(lb.x1 / CELL);
      const ly0 = Math.floor(lb.y0 / CELL), ly1 = Math.ceil(lb.y1 / CELL);
      for (let gx = lx0; gx <= lx1; gx++)
        for (let gy = ly0; gy <= ly1; gy++) local.push([gx, gy]);
    }
    it.local = local;
  }
  const fits = (it, ogx, ogy) => {
    for (const [di, dj] of it.local) {
      const gx = ogx + di, gy = ogy + dj;
      for (let px = -PAD_CELLS; px <= PAD_CELLS; px++)
        for (let py = -PAD_CELLS; py <= PAD_CELLS; py++)
          if (occupied.has((gx + px) + "|" + (gy + py))) return false;
    }
    return true;
  };
  const commit = (it, ogx, ogy) => { for (const [di, dj] of it.local) occupied.add((ogx + di) + "|" + (ogy + dj)); };
  items.forEach((it, i) => {
    let cx = 0, cy = 0;
    if (i > 0) {
      let a = 0, r = 0;
      for (let k = 0; k < 60000; k++) {
        cx = r * asp * Math.cos(a); cy = r * Math.sin(a);
        const ogx = Math.round((cx - it.W / 2) / CELL), ogy = Math.round((cy - it.H / 2) / CELL);
        if (fits(it, ogx, ogy)) break;
        a += 0.3; r += 0.45;
      }
    }
    it.cx = cx; it.cy = cy;
    commit(it, Math.round((cx - it.W / 2) / CELL), Math.round((cy - it.H / 2) / CELL));
  });
}

async function layout() {
  const collage = document.getElementById("collage");
  const emptyEl = document.getElementById("empty");
  collage.innerHTML = "";
  placed = []; hovered = null;
  const tip = document.getElementById("tip");
  tip.classList.remove("show"); tip.setAttribute("aria-hidden", "true");
  emptyEl.style.display = "none";

  const windowDays = (cfg && cfg.days) || 30;
  const whose = (cfg && cfg.whose) || "both";
  const kept = ALL.filter((o) => {
    if (daysAgo(o.obsDt) > windowDays + 0.999) return false;
    if (whose === "both") return needsAny(o);
    return needsFor(o, whose);
  });

  const people = peopleOf(cfg);
  const labels = people.map((p) => p.label);
  const whoLabel = whose === "both"
    ? (labels.join(" or ") || "anyone")
    : ((people.find((p) => p.id === whose) || {}).label || whose);
  const whoVerb = whose === "both" && people.length > 1 ? "need" : "needs";
  const fetchedStr = fetchedAt ? new Date(fetchedAt * 1000).toLocaleString() : "—";
  let status = cfg
    ? `${kept.length} species ${whoLabel} ${whoVerb} · within ${cfg.dist_miles} mi · last ${windowDays} day${windowDays === 1 ? "" : "s"} · sightings as of ${fetchedStr}`
    : "";
  if (cfg && cfg.life_counts) {
    const missing = people.filter((p) => !cfg.life_counts[p.id]).map((p) => p.label);
    if (missing.length) status += ` · ${missing.join(" & ")}'s life list not uploaded (tap ⚙)`;
  }
  document.getElementById("status").textContent = status;

  if (!kept.length) {
    emptyEl.textContent = `Nothing ${whoLabel} ${whoVerb} has been reported nearby in this window.`;
    emptyEl.style.display = "block";
    return;
  }

  const FLIGHT_SCALE = 1.3; // wingspan is wider than body length, so fly bigger
  const maxLen = Math.max(...kept.map((o) => o.lengthIn));
  const items = kept.map((o) => {
    let s = BASE * Math.max(o.lengthIn / maxLen, MIN / BASE);
    if (o.pose === "flight") s *= FLIGHT_SCALE;
    return { o, s };
  });

  // Load each bird's silhouette, then size its tile so its AREA (W*H) tracks
  // length² — the bird's on-screen bulk is the same whatever its pose/aspect,
  // so a compact upright bird no longer looks tiny beside a spread one of
  // similar size. Tile aspect = image aspect, so no letterbox either.
  const labelMode = (cfg && cfg.labels) || "off";
  await Promise.all(items.map(async (it) => {
    it.sil = await ensureSil(it.o.img);
    if (labelMode === "nested") it.fine = await ensureFine(it.o.img);
    const ar = Math.max(0.33, Math.min(3.2, it.sil.ar)); // allow herons/swifts (tall) & loons/skimmers (long)
    const rt = Math.sqrt(ar);
    it.W = Math.round(it.s * rt);
    it.H = Math.round(it.s / rt);
  }));
  items.sort((a, b) => b.s - a.s);

  // Shape the flock to the screen: a circle when portrait/square, an oval that
  // uses more width on a landscape/panorama monitor (capped so it never gets
  // too stretched). fit() keeps the margins and bottom-weighting.
  const availW0 = window.innerWidth - 48, availH0 = window.innerHeight - 76;
  const flockAspect = Math.max(1, Math.min(2.4, availW0 / availH0));
  measureLabels(items, labelMode);
  pack(items, flockAspect);

  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const it of items) {
    // A name can hang below the art and wider than it, so it counts toward the
    // flock's extent — otherwise fit() would scale the lettering off-screen.
    const lb = it.labelBox;
    const l = it.cx - it.W / 2, t = it.cy - it.H / 2;
    minX = Math.min(minX, lb ? l + Math.min(0, lb.x0) : l);
    maxX = Math.max(maxX, l + (lb ? Math.max(it.W, lb.x1) : it.W));
    minY = Math.min(minY, lb ? t + Math.min(0, lb.y0) : t);
    maxY = Math.max(maxY, t + (lb ? Math.max(it.H, lb.y1) : it.H));
  }
  const W = maxX - minX, H = maxY - minY;

  placed = [];
  for (const it of items) {
    const o = it.o;
    const left = Math.round(it.cx - it.W / 2 - minX), top = Math.round(it.cy - it.H / 2 - minY);
    const a = document.createElement("a");
    a.className = "tile";
    a.href = speciesLinkParams(o);
    a.style.left = `${left}px`;
    a.style.top = `${top}px`;
    a.style.width = `${it.W}px`;

    const art = document.createElement("div");
    art.className = "art";
    art.style.height = `${it.H}px`;
    const img = document.createElement("img");
    img.src = o.img;
    img.alt = o.comName;
    img.onerror = () => { img.onerror = null; img.src = "/images/placeholder.svg"; };
    art.appendChild(img);

    a.append(art);
    if (it.label && it.label.mode === "nested") {
      // <textPath> sets each glyph on its own local tangent, so the name bends
      // with the bird's edge instead of standing on a chord through it.
      const NS = "http://www.w3.org/2000/svg";
      const svg = document.createElementNS(NS, "svg");
      svg.setAttribute("class", "nameSvg");
      svg.setAttribute("width", it.W); svg.setAttribute("height", it.H);
      svg.setAttribute("viewBox", `0 0 ${it.W} ${it.H}`);
      const id = `bl${++labelUid}`;
      const path = document.createElementNS(NS, "path");
      path.setAttribute("id", id);
      path.setAttribute("d", it.label.d);
      path.setAttribute("fill", "none");
      const defs = document.createElementNS(NS, "defs");
      defs.appendChild(path);
      const text = document.createElementNS(NS, "text");
      text.setAttribute("class", "nameText");
      text.setAttribute("font-size", it.label.px);
      const tp = document.createElementNS(NS, "textPath");
      tp.setAttribute("href", `#${id}`);
      tp.setAttribute("startOffset", "50%");
      tp.setAttribute("text-anchor", "middle");
      tp.textContent = it.label.name;
      text.appendChild(tp);
      svg.append(defs, text);
      a.appendChild(svg);
    } else if (it.label) {
      const nm = document.createElement("span");
      nm.textContent = it.label.name;
      nm.style.fontSize = `${it.label.px}px`;
      nm.className = "name";
      a.appendChild(nm);
    }
    collage.appendChild(a);
    placed.push({ o, left, top, W: it.W, H: it.H, sil: it.sil, el: a });
  }

  collage.style.width = `${W}px`;
  collage.style.height = `${H}px`;
  flockNaturalW = W;
  fit(W, H);
}

function fit(W, H) {
  const collage = document.getElementById("collage");
  const sidePad = 24, topPad = 24, bottomPad = 52; // leave room above the footer
  const availW = window.innerWidth - sidePad * 2;
  const availH = window.innerHeight - topPad - bottomPad;
  // Cap the flock at ~80% of the vertical space so there's always slack to bias
  // upward — giving a grounded, bottom-weighted composition rather than one that
  // fills edge to edge.
  const vFill = 0.8;
  const scale = Math.min(availW / W, (availH * vFill) / H, 1.9);
  const usedW = W * scale, usedH = H * scale;
  // Centered left-to-right; sits a little above center (0.34 of the slack above,
  // ~two-thirds below) so the empty space pools toward the bottom.
  const offX = sidePad + Math.max(0, (availW - usedW) / 2);
  const offY = topPad + Math.max(0, (availH - usedH) * 0.34);
  collage.style.transform = `translate(${offX}px, ${offY}px) scale(${scale})`;
}

// ---- silhouette hit-testing ---------------------------------------------
// Maps a cursor point into collage coords, then finds the topmost bird whose
// actual (non-transparent) silhouette is under it — so a small bird nested in
// a flying bird's transparent bounding box gets the hover/click, not the big
// bird's empty rectangle.
function hitTest(clientX, clientY) {
  const collage = document.getElementById("collage");
  const rect = collage.getBoundingClientRect();
  if (!flockNaturalW || !rect.width) return null;
  const s = rect.width / flockNaturalW;
  const lx = (clientX - rect.left) / s, ly = (clientY - rect.top) / s;
  for (let i = placed.length - 1; i >= 0; i--) { // last-drawn (smallest) on top
    const p = placed[i];
    if (lx < p.left || ly < p.top || lx > p.left + p.W || ly > p.top + p.H) continue;
    const si = Math.min(p.sil.gw - 1, Math.floor((lx - p.left) / p.W * p.sil.gw));
    const sj = Math.min(p.sil.gh - 1, Math.floor((ly - p.top) / p.H * p.sil.gh));
    if (p.sil.set.has(si + "|" + sj)) return p;
  }
  return null;
}

(function initHitTesting() {
  const stage = document.getElementById("stage");
  let ptrType = "mouse";  // what kind of pointer produced the coming click
  let touchArmed = null;  // tile identified by the previous tap (touch only)
  stage.addEventListener("pointerdown", (e) => { ptrType = e.pointerType || "mouse"; });
  stage.addEventListener("mousemove", (e) => {
    const hit = hitTest(e.clientX, e.clientY);
    if (hit === hovered) return;
    if (hovered) unhighlight(hovered.el);
    hovered = hit;
    if (hit) highlight(hit.el, hit.o);
    stage.style.cursor = hit ? "pointer" : "default";
  });
  stage.addEventListener("mouseleave", () => {
    if (hovered) unhighlight(hovered.el);
    hovered = null;
  });
  stage.addEventListener("click", (e) => {
    const hit = hitTest(e.clientX, e.clientY);
    // On touch, the first tap identifies the bird (highlight + name pill) and a
    // second tap on the same bird opens it — a mouse hover has no touch
    // equivalent, so without this a tap jumped straight to the detail page.
    if (ptrType === "touch") {
      if (!hit) {
        if (hovered) unhighlight(hovered.el);
        hovered = touchArmed = null;
        return;
      }
      if (touchArmed !== hit) {
        if (hovered && hovered !== hit) unhighlight(hovered.el);
        hovered = touchArmed = hit;
        highlight(hit.el, hit.o);
        return;
      }
    }
    if (hit) location.href = speciesLinkParams(hit.o);
  });
})();

async function refresh() {
  const errorEl = document.getElementById("error");
  errorEl.style.display = "none";
  try {
    const [c, nearby] = await Promise.all([fetchConfig(), fetchNearby()]);
    cfg = c;
    applyTheme(cfg.theme);
    ALL = nearby.obs || [];
    fetchedAt = nearby.fetched_at || 0;
    await layout();
  } catch (err) {
    errorEl.style.display = "block";
    errorEl.textContent = "Couldn't load data:\n" + err.message;
    document.getElementById("status").textContent = "";
  }
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { if (ALL.length) layout().catch(() => {}); }, 200);
});

refresh();
// The first pack measures names with fallback metrics if the handwriting face
// hasn't arrived yet, which packs them at the wrong width. Re-lay once it has.
if (document.fonts && document.fonts.load) {
  document.fonts.load("600 16px Hand")
    .then(() => { if (cfg && cfg.labels && ALL.length) return layout(); })
    .catch(() => {});
}
// Re-check hourly; the server only re-polls eBird when its 1h cache expires,
// so these are cheap local reads that also pick up settings/list changes.
setInterval(refresh, 60 * 60 * 1000);
</script>
</body>
</html>
